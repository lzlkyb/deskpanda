[package]
name = "deskpanda"
version = "0.1.1"
description = "Tauri 2 desktop app shell: architecture + auto-update + design system"
edition = "2021"

[features]
default = ["notifications"]
# notifications 功能包含桌面通知。用 cargo feature 而非 #[cfg(not(test))] 门控：
# 后者对集成测试无效（lib 作为依赖编译时不带 test cfg）。
# 注：2026-10-27 定位到的 0xc0000139 真正根因是 comctl32 v6 manifest 缺失
# （见 build.rs），与 notification 插件无直接关系；但默认关闭它能让测试
# 二进制少链一堆 GUI 原生代码，保持测试轻量。
notifications = ["dep:tauri-plugin-notification"]
# 实验特性：绕中继时尝试 EasyTier 打洞（`rc/underlay/`）。**默认关**。
# 保留成显式 feature 而不是删掉那段代码：`rc/underlay.rs` 的 `cfg!(feature = ...)`
# 是「默认值」，真正开关还在配置项 `rc_easytier_enabled` 上；
# 写成不存在的 feature 会让每次编译都报 unexpected_cfgs（CI 视警告为噪音）。
easytier-underlay = []
# 注：原 `ui-guards` feature 已删除（2026-11-20，S4 第二段补线）。它当初存在是因为
# `rc/tests/guards.rs` 里那几条「命令注册 / capabilities / 前端 invoke」守卫的审计
# 对象还没被造出来；现在接线齐了，那几条已改成**常开**，feature 留着只会让它们
# 永远进不了门禁（`pre-push` 跑的是 `cargo test --no-default-features`）。

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 给 cargo test 目标补嵌 comctl32 v6 manifest（缘由见 build.rs 长注释）
embed-resource = "3"
# macOS 桥接（S6）：build.rs 的 mac 段用它编译 src/macos/ 下的 .m/.c
cc = "1"

[dependencies]
# Tauri core
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
# 更新源 env 覆盖（APP_UPDATE_ENDPOINT）构造 Url 用，与插件共用同一份 url 2.x
url = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-opener = "2"
# 2026-10-27 删除 clipboard-manager / dialog 两个插件依赖：前端剪贴板全走
# navigator.clipboard Web API，没有任何 invoke 调用它们；Rust 侧也零使用
# （原本只是无脑注册）。少两个插件 = 少两份 IPC 命令面 + 二进制更小。

# Async runtime（后台任务：可见性复核、任务自愈重启；rc 需要 full）
tokio = { version = "1", features = ["full"] }

# Serialization（配置 JSON 持久化 + 更新事件推送）
serde = { version = "1", features = ["derive"] }
# `preserve_order` 不是可选项：rc 有一条**跨端字节契约**测试
# （`rc::wts_watch::frame_bytes_are_pinned`）钉住 `{"t":"wts", "locked":…}` 的字段顺序，
# 控端按这两个字节串解析。不开这个 feature，`serde_json::json!` 走 BTreeMap 会按
# 字典序输出成 `{"locked":…,"t":"wts"}`，契约当场失效（且只在测试红，线上是静默不兼容）。
serde_json = { version = "1", features = ["preserve_order"] }

# 日志（env_logger 初始化在 main.rs）
log = "0.4"
env_logger = "0.11"

# macOS AV1 编解码 dylib 的按需加载（S6）：dylib 缺失只降级 AV1 档，不影响 AVC 路径
libloading = "0.8"

# 托盘图标代码绘制（PNG 解码 + 缩放 + 状态圆点）
png = "0.17"

# ── 远程桌面（rc，从 PastePanda 迁入）──
# 传输层：LAN 直连与跨网打洞/relay 共用同一套栈（见 PastePanda 的同段注释）。
# feature 取舍：tls-ring 必须（预设要 crypto provider，且 ring 已在依赖树）；
# portmapper 保留（UPnP/PCP 提高 NAT 打洞成功率）；metrics / fast-apple-datapath 去掉。
iroh = { version = "1.1", default-features = false, features = [
    "tls-ring",
    "portmapper",
    "unstable-net-report",
] }
# BBR3 拥塞控制；版本必须与 iroh 内用的 noq-proto 一致（靠文末 patch 钉住同一份）
noq-proto = "1.2.0"
# 编解码 / 加密 / 序列化
ring = "0.17"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "rand"] }
sha2 = "0.10"
image = { version = "0.25", features = ["png"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
futures-util = "0.3"
# 设备表 / 设置（rc 的 rc_devices 等）
rusqlite = { version = "0.31", features = ["bundled"] }
# 局域网发现：逐块网卡组播（见 net/mcast.rs 的「为什么不能用 INADDR_ANY」）
netdev = "0.46"
socket2 = "0.6"
# NV12/BGRA 缩放（本地 crate，原 pastepanda-rc-scale 改名）
deskpanda-rc-scale = { path = "crates/rc-scale" }
# rc/underlay/fetch.rs 拉取公告（rustls 免 OpenSSL 构建依赖）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# 进程级 rustls crypto provider 预装用（`app.rs` 的 `ensure_crypto_provider`）。
# 不增加编译量：rustls 0.23 已由 reqwest/iroh 带入且带 ring feature（见
# `cargo tree --target aarch64-linux-android -e features -p rustls`），这里只是
# 把「显式装一次 provider」的权利握在自己手里。先例：pastePanda 2026-09-30
# 真机实测 Android 启动即崩（"No rustls crypto provider is configured"），
# 崩溃发生在 Tauri 建 WebView 的内部 reqwest 上、cargo check 抓不到。
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# argon2 的 OsRng 依赖 rand_core 的 getrandom feature；主 App 靠其他依赖合并启用，
# 新仓没有那些依赖，必须显式声明，否则 unop.rs 的 SaltString::generate 编译不过。
rand_core = { version = "0.6", features = ["getrandom"] }

# 桌面专属依赖（Android/iOS 目标不编译，2026-11-20 手机端迁移 S7 补）：
# - tauri-plugin-single-instance：单实例是桌面语义，插件本身无 Android 实现；
# - arboard：跨平台剪贴板 crate，**无 Android 后端**（rc/input.rs 的桌面回退路径用；
#   Android 侧剪贴板走 WebView 与 Kotlin 插件，不经过它）。
# pastePanda 同款依赖在 2026-09-29 探针实测过（docs/远程电脑-手机端-P0.5探针报告），
# 结论：不排除这两条，`cargo` 解析 Android 目标时直接报 no matching package。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
arboard = { version = "3", features = ["image-data"] }

# Windows 专属：DWM 圆角（壳）+ 远程桌面的采集/编码/输入/音频绑定
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "implement",
  # 壳：Win11 窗口装饰
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  # rc：会话 / 输入注入 / 窗口枚举
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  # dpapi：设备身份种子的静态加密（CryptProtectData）
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_Graphics_Gdi",
  # rc：DXGI Desktop Duplication + D3D11 抓帧
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  # rc：Media Foundation 硬件 H.264 / HEVC
  "Win32_Media_MediaFoundation",
  "Win32_Media",
  # rc：WIC 编 JPEG（系统自带，零额外体积）
  "Win32_Graphics_Imaging",
  "Win32_System_Variant",
  "Win32_System_Com_StructuredStorage",
  # rc：WASAPI 环回采集（系统声音）+ 端点音量（远程静音）
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  # rc：会话防休眠 / 锁屏感知
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_Storage_FileSystem",
] }
# rc/mod.rs：读注册表判断远程桌面会话等
winreg = "0.52"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# 仅为测试构造 UpdaterError::Semver 变体（插件错误的确定性分类断言）。
# updater 插件已传递依赖 semver 1.x，这里不增加实际编译量。
semver = "1"

[profile.release]
# codegen-units 用默认 16 而不是 1：跨单元优化已由 lto = "thin" 提供，
# 两者收益重叠。压到 1 只是禁用 LLVM 并行代码生成——编译慢 2~3 倍，
# 却换不来多少体积或性能收益。
# ⚠️ 体积红线：改动后必须核对 installer 体积——壳子基线应 ≤ 10MB；
# 若涨超预算就改回 1。
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = "symbols"

# Keep iroh and the application on one noq-proto type, with the tested BBR backport.
# 不加这条：iroh 内部的 noq-proto 与直接依赖会是两个不同实例，rc/net.rs 的
# 传输配置（拥塞控制）编译不过。副本与 PastePanda 同源。
[patch.crates-io]
noq-proto = { path = "vendor/noq-proto" }

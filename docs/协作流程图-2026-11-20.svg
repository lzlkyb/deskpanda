<svg viewBox="0 0 680 276" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>DeskPanda 协作开发流程</title>
  <desc>从需求到发版的六步流程：需求 Issue、功能分支、本地七项门禁、发起 PR、Review 审批、合并 main 后打 tag 发版。</desc>
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="56" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="120" y="76" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">需求 / Issue</text>
  <text x="120" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#185FA5">先定任务与验收</text>

  <rect x="260" y="56" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">功能分支</text>
  <text x="340" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#185FA5">一人一支，禁直推 main</text>

  <rect x="480" y="56" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="560" y="76" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">本地 7 项门禁</text>
  <text x="560" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#185FA5">全绿才允许推送</text>

  <path d="M204 84 L252 84" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <path d="M424 84 L472 84" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <path d="M560 112 L560 150 Q560 156 554 156 L126 156 Q120 156 120 162 L120 196" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <rect x="40" y="200" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="120" y="220" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">发起 PR</text>
  <text x="120" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">模板 + CHANGELOG</text>

  <rect x="260" y="200" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="220" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Review 审批</text>
  <text x="340" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">CI 绿灯 + 1 人 approve</text>

  <rect x="480" y="200" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="560" y="220" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">合并 main</text>
  <text x="560" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">tag 触发双平台发版</text>

  <path d="M204 228 L252 228" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <path d="M424 228 L472 228" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrGreen)"/>
</svg>
